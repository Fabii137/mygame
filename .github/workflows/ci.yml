name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            name: Win64-MSVC
            cmake_options: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
            artifact: mygame-windows-x64-msvc
            executable: mygame.exe

          - os: windows-latest
            name: Win64-ClangCL
            cmake_options: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
            artifact: mygame-windows-x64-clangcl
            executable: mygame.exe

          - os: ubuntu-latest
            name: Linux64-GCC
            cmake_options: -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
            artifact: mygame-linux-x64-gcc
            executable: mygame

          - os: ubuntu-latest
            name: Linux64-Clang
            cmake_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            artifact: mygame-linux-x64-clang
            executable: mygame

          - os: macos-15-intel
            name: MacOS64-Clang
            cmake_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            artifact: mygame-macos-x64-clang
            executable: mygame

          - os: macos-latest
            name: MacOSARM64-Clang
            cmake_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
            artifact: mygame-macos-arm64-clang
            executable: mygame

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        if: runner.os == 'Windows' && matrix.name == 'Win64-MSVC'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Linux GCC14
        if: runner.os == 'Linux' && matrix.name == 'Linux64-GCC'
        run: |
          sudo apt-get install -y gcc-14 g++-14

      - name: Configure CMake
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPRODUCTION_BUILD=ON \
            ${{ matrix.cmake_options }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify build
        shell: bash
        run: |
          test -f "build/${{ matrix.executable }}"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "build/${{ matrix.executable }}" "dist/"
          cp -r resources dist/resources

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
