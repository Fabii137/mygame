name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            name: Win64-MSVC
            cmake_options: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
            artifact: mygame-windows-x64-msvc
            archive: mygame-windows-x64-msvc.zip
            executable: mygame.exe

          - os: windows-latest
            name: Win64-ClangCL
            cmake_options: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
            artifact: mygame-windows-x64-clangcl
            archive: mygame-windows-x64-clangcl.zip
            executable: mygame.exe

          - os: ubuntu-latest
            name: Linux64-GCC
            cmake_options: -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
            artifact: mygame-linux-x64-gcc
            archive: mygame-linux-x64-gcc.tar.gz
            executable: mygame

          - os: ubuntu-latest
            name: Linux64-Clang
            cmake_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            artifact: mygame-linux-x64-clang
            archive: mygame-linux-x64-clang.tar.gz
            executable: mygame

          - os: macos-15-intel
            name: MacOS64-Clang
            cmake_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            artifact: mygame-macos-x64-clang
            archive: mygame-macos-x64-clang.tar.gz
            executable: mygame

          - os: macos-latest
            name: MacOSARM64-Clang
            cmake_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
            artifact: mygame-macos-arm64-clang
            archive: mygame-macos-arm64-clang.tar.gz
            executable: mygame

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        if: runner.os == 'Windows' && matrix.name == 'Win64-MSVC'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Linux GCC14
        if: runner.os == 'Linux' && matrix.name == 'Linux64-GCC'
        run: sudo apt-get install -y gcc-14 g++-14

      - name: Configure CMake
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPRODUCTION_BUILD=ON \
            ${{ matrix.cmake_options }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify build
        shell: bash
        run: |
          test -f "build/${{ matrix.executable }}"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "build/${{ matrix.executable }}" "dist/"
          cp -r resources dist/resources
          cp -r texturePacks dist/texturePacks

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"

      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.archive }}" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mygame-*
          path: release/
          merge-multiple: true

      - name: List release files
        run: find release -maxdepth 2 -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.tar.gz
