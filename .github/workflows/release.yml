name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows x64 MSVC artifact
        uses: actions/download-artifact@v4
        with:
          name: mygame-windows-x64-msvc
          path: release/

      - name: Download Windows x64 ClangCL artifact
        uses: actions/download-artifact@v4
        with:
          name: mygame-windows-x64-clangcl
          path: release/

      - name: Download Linux x64 GCC artifact
        uses: actions/download-artifact@v4
        with:
          name: mygame-linux-x64-gcc
          path: release/

      - name: Download Linux x64 Clang artifact
        uses: actions/download-artifact@v4
        with:
          name: mygame-linux-x64-clang
          path: release/

      - name: Download macOS x64 Clang artifact
        uses: actions/download-artifact@v4
        with:
          name: mygame-macos-x64-clang
          path: release/

      - name: Download macOS ARM64 Clang artifact
        uses: actions/download-artifact@v4
        with:
          name: mygame-macos-arm64-clang
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/mygame-windows-x64-msvc.zip
            release/mygame-windows-x64-clangcl.zip
            release/mygame-linux-x64-gcc.tar.gz
            release/mygame-linux-x64-clang.tar.gz
            release/mygame-macos-x64-clang.tar.gz
            release/mygame-macos-arm64-clang.tar.gz
