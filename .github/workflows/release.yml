name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            archive: mygame-windows-x64.zip
            executable: mygame.exe

          - name: Linux x64
            os: ubuntu-latest
            archive: mygame-linux-x64.tar.gz
            executable: mygame

          - name: macOS arm64
            os: macos-latest
            archive: mygame-macos-arm64.tar.gz
            executable: mygame

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure CMake
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPRODUCTION_BUILD=ON \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare package
        shell: bash
        run: |
          mkdir -p package/mygame/settings
          cp "build/${{ matrix.executable }}" \
             "package/mygame/"
          cp -r resources package/mygame/resources
          cp -r texturePacks package/mygame/texturePacks

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path package/mygame/* `
            -DestinationPath "${{ matrix.archive }}"

      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.archive }}" \
            -C package \
            mygame

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mygame-windows-x64.zip
          path: release/

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: mygame-linux-x64.tar.gz
          path: release/

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: mygame-macos-arm64.tar.gz
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/mygame-windows-x64.zip
            release/mygame-linux-x64.tar.gz
            release/mygame-macos-arm64.tar.gz
